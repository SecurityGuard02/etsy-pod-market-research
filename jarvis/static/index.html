  <script>
  'use strict';
  const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let state={},page='overview',setupStep=0,setupDraft={},refreshing=false,voiceAudio=null,catalogData=null,etsyOptions=null,pinterestBoards=null;
  const pageNames={overview:'Genel bakış',connections:'Bağlantılar',preferences:'Tercihler',activity:'İşlem geçmişi'};
  const secrets=new Set(['telegram_bot_token','openai_api_key','etsy_key','etsy_secret','printify_token','instagram_access_token','instagram_client_secret','pinterest_access_token','pinterest_client_secret']);
  const settingsDefaults={niche:'Minimalist doğa ve günlük yaşam',target_country:'US',currency:'USD',language:'en',time_zone:'Europe/Istanbul',hour:9,budget_per_run:3,retail_price:29.9,printify_variant_ids:[],production_partner_ids:[],scheduling_enabled:false,dry_run:true};
  const fieldDefs={
    telegram_bot_token:{label:'Telegram bot anahtarı',placeholder:'BotFather tarafından verilen anahtar',help:'Telegram’da @BotFather → /newbot ile oluşturulur.',link:'https://t.me/BotFather'},
    telegram_chat_id:{label:'Telegram sohbet kimliği',placeholder:'Otomatik bulabiliriz',help:'“Telegram’ı eşleştir” bağlantısıyla otomatik bulunur; elle girmen gerekmez.'},
    openai_api_key:{label:'OpenAI API anahtarı',placeholder:'sk-…',help:'Araştırma, tasarım, metin ve ses üretimi için.',link:'https://platform.openai.com/api-keys'},
    etsy_key:{label:'Etsy uygulama anahtarı (keystring)',placeholder:'Etsy geliştirici uygulama anahtarı',link:'https://www.etsy.com/developers/your-apps'},
    etsy_secret:{label:'Etsy shared secret',placeholder:'Etsy uygulama gizli anahtarı'},
    etsy_shop_id:{label:'Etsy mağaza kimliği',placeholder:'Sayısal shop_id'},
    printify_token:{label:'Printify API anahtarı',placeholder:'Personal access token',link:'https://printify.com/app/account/api'},
    printify_shop_id:{label:'Printify mağaza kimliği',placeholder:'Etsy ile bağlantılı mağazanın kimliği'},

    instagram_client_secret:{label:'Instagram uygulama gizli anahtarı',placeholder:'Meta App secret'},
    instagram_access_token:{label:'Instagram erişim anahtarı',placeholder:'Meta tarafından verilen erişim anahtarı'},
    instagram_account_id:{label:'Instagram profesyonel hesap kimliği',placeholder:'Instagram business / creator ID'},
    pinterest_access_token:{label:'Pinterest erişim anahtarı',placeholder:'OAuth veya geliştirici erişim anahtarı'},
    pinterest_board_id:{label:'Pinterest pano kimliği',placeholder:'Ürünlerin paylaşılacağı pano'},
    pinterest_client_id:{label:'Pinterest uygulama kimliği',placeholder:'App ID'},
    pinterest_client_secret:{label:'Pinterest uygulama gizli anahtarı',placeholder:'App secret'},
    etsy_shipping_profile_id:{label:'Kargo profili',placeholder:'Mağazandan otomatik getir'},
    etsy_readiness_state_id:{label:'Üretim hazırlık profili',placeholder:'Mağazandan otomatik getir'},
    etsy_taxonomy_id:{label:'Etsy ürün kategorisi',type:'number',min:1,step:1,help:'Etsy kategori kimliği; mağaza seçenekleri yüklendiğinde seçebilirsin.'},
    etsy_return_policy_id:{label:'İade politikası',placeholder:'Mağazandan otomatik getir'},
    production_partner_ids:{label:'Üretim ortakları',placeholder:'Printify üretim ortağı'},

    target_country:{label:'Hedef pazar',options:[['US','Amerika Birleşik Devletleri'],['GB','Birleşik Krallık'],['DE','Almanya'],['CA','Kanada'],['AU','Avustralya'],['TR','Türkiye']]},
    currency:{label:'Para birimi',options:[['USD','USD · Amerikan doları'],['EUR','EUR · Euro'],['GBP','GBP · İngiliz sterlini'],['TRY','TRY · Türk lirası']]},
    language:{label:'Ürün ve paylaşım dili',options:[['en','İngilizce'],['tr','Türkçe'],['de','Almanca']]},
    time_zone:{label:'Saat dilimi',placeholder:'Europe/Istanbul',help:'Araştırma pazartesi, çarşamba ve cuma bu saat dilimine göre başlar.'},
    hour:{label:'Araştırma saati',type:'number',min:0,max:23,step:1,help:'0–23 arasında yerel saat.'},
    budget_per_run:{label:'Tahmini paket bütçesi (USD)',type:'number',min:.1,max:100,step:.1,help:'Harcama hedefidir; garanti edilen dolar sınırı değildir. Gerçek ücret değişebilir. Sağlayıcı hesabındaki bütçe kontrollerini de kullan.'},
    retail_price:{label:'Varsayılan satış fiyatı',type:'number',min:1,max:10000,step:.01,help:'Son fiyat ürün taslağında gösterilir ve onayınla ilerler.'},
    printify_blueprint_id:{label:'Printify ürün şablonu kimliği',type:'number',min:1,step:1,help:'Seçilen tişört veya giyim ürününün blueprint ID değeri.'},
    printify_provider_id:{label:'Printify baskı sağlayıcısı kimliği',type:'number',min:1,step:1,help:'Hedef pazara ve ürün şablonuna uygun print provider ID.'},
    printify_variant_ids:{label:'Satılacak varyant kimlikleri',placeholder:'Örn. 17887, 17888, 17889',help:'Beden ve renklerin variant ID değerleri, virgülle ayrılır. Boşsa mevcut ürün uygunluğu kontrol edilir.'}
  };
  function listValues(value){return Array.isArray(value)?value:typeof value==='string'?value.split(',').map(v=>v.trim()).filter(Boolean):[]}
  function setting(name){return state.settings?.[name]??settingsDefaults[name]??''}
  function field(name,values={},prefix='',opts={}){
    const d=fieldDefs[name]||{label:name},secret=secrets.has(name),present=!!state.presence?.[name],value=Object.hasOwn(values,name)?values[name]:(secret?'':setting(name));
    const id=prefix+name,attrs=`id="${esc(id)}" name="${esc(name)}" ${opts.required?'required':''}`;
    let input=d.options?`<select ${attrs}>${d.options.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input ${attrs} type="${secret?'password':d.type||'text'}" value="${esc(value)}" placeholder="${esc(secret&&present?'Kaydedildi · değiştirmek için yeni anahtar gir':d.placeholder||'')}" ${secret?'autocomplete="new-password" spellcheck="false"':d.type==='number'?`min="${d.min}" max="${d.max}" step="${d.step}"`:'autocomplete="off"'}>`;
    return `<div class="field ${opts.full?'full':''}"><div class="field-heading"><label for="${esc(id)}">${esc(d.label)}</label>${secret&&present?'<span class="saved">✓ Kaydedildi</span>':''}</div>${input}${d.help||d.link?`<small>${esc(d.help||'')}${d.link?` <a href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">Anahtar oluştur ↗</a>`:''}</small>`:''}</div>`;
  }
  function formValues(form){const result={};new FormData(form).forEach((v,k)=>{const str=String(v).trim();if(secrets.has(k)&&!str)return;result[k]=fieldDefs[k]?.type==='number'?(str===''?null:Number(str)):str});$$('input[type=checkbox][name]',form).forEach(el=>{if(!el.dataset.list)result[el.name]=el.checked});return result}
  function toast(message,error=false){const el=document.createElement('div');el.className='toast'+(error?' error-toast':'');el.textContent=message;$('#toasts').append(el);while($('#toasts').children.length>3)$('#toasts').firstElementChild.remove();setTimeout(()=>el.remove(),error?10000:6000)}
  async function api(path,{method='GET',body,headers={},...rest}={}){
    const response=await fetch(path,{method,credentials:'same-origin',headers:{...(body!==undefined?{'Content-Type':'application/json'}:{}),...(state.csrf_token&&method!=='GET'?{'X-CSRF-Token':state.csrf_token}:{}),...headers},...(body!==undefined?{body:JSON.stringify(body)}:{}),...rest});
    const contentType=response.headers.get('content-type')||'';let data=contentType.includes('json')?await response.json():await response.text();
    if(!response.ok){if(response.status===401&&path!=='/api/login'){await loadState(false)}const detail=data?.detail||data?.error||data?.message||data;throw new Error(typeof detail==='string'?detail:JSON.stringify(detail)||`İşlem tamamlanamadı (${response.status}).`)}return data;
  }
  async function busy(button,job){if(button?.disabled)return;const previous=button?.innerHTML;if(button){button.disabled=true;button.textContent='Biraz bekle…'}try{return await job()}catch(e){toast(e.message,true)}finally{if(button?.isConnected){button.disabled=false;button.innerHTML=previous}}}
  async function loadState(render=true){if(refreshing)return;refreshing=true;try{state=await api('/api/state');$('#boot').classList.add('hidden');if(!state.authenticated){$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');if(render||!$('#auth').innerHTML)renderAuth()}else{$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');if(render)renderPage();updateChrome()}return state}finally{refreshing=false}}
  function renderAuth(){const initial=!state.configured;$('#auth').innerHTML=`<header class="auth-head"><div class="brand"><span class="brand-mark"></span>JARVIS</div><span class="tag"><span class="dot"></span>Senin özel çalışma alanın</span></header><div class="auth-grid"><section class="auth-story"><div class="eyebrow">Sen hayatına devam et.</div><h1>Fikirden mağazana,<br>birlikte üretelim.</h1><p>JARVIS trendleri araştırır, özgün baskılar hazırlar ve ürünlerini yayına taşır. Her önemli adımda karar sende kalır.</p><div class="orb"></div><div class="auth-points"><div><span>◷</span> Pazartesi, çarşamba ve cuma araştırma</div><div><span>✳</span> Her araştırmada 5 özgün tasarım</div><div><span>↗</span> Telegram’dan adım adım onay</div></div></section><section><div class="panel auth-form">${initial?renderSetup():`<div class="eyebrow">Tekrar hoş geldin</div><h2>Çalışma alanına giriş yap</h2><p>Kurulum sırasında belirlediğin yönetici parolasını kullan.</p><form id="login-form" class="login-form"><div class="field"><label for="login-password">Yönetici parolası</label><input id="login-password" type="password" name="password" required autocomplete="current-password" autofocus></div><button class="btn btn-primary" type="submit">Giriş yap →</button><div class="error" id="auth-error" role="alert"></div></form>`}</div><p class="auth-foot">API anahtarların tarayıcıda saklanmaz ve ekranda tekrar gösterilmez. Etsy, Instagram veya Pinterest hesap parolanı istemeyiz.</p></section></div>`;bindAuth()}
  function renderSetup(){const titles=['Önce çalışma alanını koruyalım','Asistanına güç ver','Sana uygun çalışma düzeni'];const descriptions=['Bir yönetici parolası belirle. Sonraki ayarları daha sonra da değiştirebilirsin.','OpenAI üretim yapar, Telegram onaylarını getirir. Diğer platformları içeri girdikten sonra bağlayabilirsin.','JARVIS haftada üç gün bu tercihlere göre araştırma hazırlayacak.'];
    return `<div class="eyebrow">İlk kurulum · ${setupStep+1} / 3</div><h2>${titles[setupStep]}</h2><p>${descriptions[setupStep]}</p><div class="steps">${[0,1,2].map(i=>`<div class="step ${i<=setupStep?'active':''}"></div>`).join('')}</div><form id="setup-form">${setupStep===0?`<div class="field"><label for="setup-password">Yönetici parolası</label><input id="setup-password" type="password" name="password" minlength="12" required autocomplete="new-password" value="${esc(setupDraft.password||'')}"><small>En az 12 karakter. Bu parolayla yalnızca JARVIS’e giriş yapacaksın.</small></div><div class="field" style="margin-top:20px"><label for="setup-token">Kurulum kodu <span class="muted">· varsa</span></label><input id="setup-token" type="password" name="setup_token" autocomplete="off" value="${esc(setupDraft.setup_token||'')}" placeholder="Dağıtım sırasında oluşturulan kod"><small>Sunucuda JARVIS_SETUP_TOKEN ayarlandıysa gerekli. API anahtarın değildir.</small></div>`:setupStep===1?`<div class="field-grid">${field('openai_api_key',setupDraft,'setup-',{full:true})}${field('telegram_bot_token',setupDraft,'setup-',{full:true})}${field('telegram_chat_id',setupDraft,'setup-',{full:true})}</div><div class="notice info" style="margin-top:20px">Anahtarların henüz hazır değilse devam edebilirsin. Gerçek üretim, gerekli bağlantılar doğrulanınca kullanılabilir.</div>`:`<div class="field-grid">${field('niche',setupDraft,'setup-',{full:true})}${field('target_country',setupDraft,'setup-')}${field('language',setupDraft,'setup-')}${field('hour',setupDraft,'setup-')}${field('budget_per_run',setupDraft,'setup-')}</div><div class="notice info" style="margin-top:20px">Program: pazartesi · çarşamba · cuma, Europe/Istanbul. Önce bağlantı denemesi yapabilirsin. Otomatik program başlangıçta kapalıdır.</div>`}<div class="setup-nav">${setupStep?'<button type="button" class="btn btn-quiet" id="setup-back">← Geri</button>':'<span class="step-caption">Yaklaşık 2 dakika</span>'}<button class="btn btn-primary" type="submit">${setupStep===2?'Çalışma alanını oluştur →':'Devam et →'}</button></div><div class="error" id="auth-error" role="alert"></div></form>`;
  }
  function bindAuth(){const login=$('#login-form');login?.addEventListener('submit',e=>{e.preventDefault();const btn=$('button[type=submit]',login);busy(btn,async()=>{try{await api('/api/login',{method:'POST',body:{password:new FormData(login).get('password')}});await loadState()}catch(error){$('#auth-error').textContent=error.message}})});const setup=$('#setup-form');setup?.addEventListener('submit',e=>{e.preventDefault();Object.assign(setupDraft,formValues(setup));if(setupStep<2){setupStep++;renderAuth();return}busy($('button[type=submit]',setup),async()=>{try{const {password,setup_token,...settings}=setupDraft;await api('/api/setup',{method:'POST',headers:setup_token?{'X-Setup-Token':setup_token}:{},body:{password,settings:{...settingsDefaults,...settings}}});setupDraft={};await loadState();toast('Çalışma alanın hazır. Platform bağlantılarını tamamlayabilirsin.')}catch(error){$('#auth-error').textContent=error.message}})});$('#setup-back')?.addEventListener('click',()=>{Object.assign(setupDraft,formValues(setup));setupStep--;renderAuth()})}
  function pendingActions(){return(state.campaigns||[]).flatMap(c=>(c.actions||c.pending_actions||[]).filter(a=>a.status!=='approved'&&a.status!=='rejected'&&a.used!==true))}
  function paused(){return !!(state.paused??state.settings?.paused)}
  function scheduled(){return !!state.settings?.scheduling_enabled}
  function updateChrome(){const count=pendingActions().length;$('#nav-count').textContent=count;$('#nav-count').classList.toggle('hidden',!count);const tag=$('#runtime-tag');const running=!!(state.running||state.active_run);tag.className='tag '+(paused()?'warn':running?'ok':'');tag.innerHTML=`<span class="dot"></span>${paused()?'Program duraklatıldı':running?'Araştırma sürüyor':!scheduled()?'Program henüz açık değil':state.settings?.dry_run?'Program · deneme modu':'Program aktif'}`;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#page-label').textContent=pageNames[page]}
  function renderPage(){updateChrome();$('#page-content').innerHTML=page==='overview'?renderOverview():page==='connections'?renderConnections():page==='preferences'?renderPreferences():renderActivity();bindPage()}
  function formattedTime(value,options={}){if(!value)return'—';const date=new Date(typeof value==='number'&&value<1e12?value*1000:value);return Number.isNaN(date.getTime())?String(value):new Intl.DateTimeFormat('tr-TR',{timeZone:setting('time_zone')||'Europe/Istanbul',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',...options}).format(date)}
  function scheduleTime(){const raw=state.next_run||state.next_run_at||state.schedule?.next_run;if(raw)return formattedTime(raw);const tz=setting('time_zone')||'Europe/Istanbul',h=Number(setting('hour'));try{const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short',hour:'numeric',hourCycle:'h23'}).formatToParts(new Date()),day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.find(p=>p.type==='weekday')?.value),hour=Number(parts.find(p=>p.type==='hour')?.value),days=[1,3,5];let d=days.find(x=>x>day||(x===day&&hour<h));return (d===undefined?'Pazartesi':['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'][d])+' '+String(h).padStart(2,'0')+':00'}catch{return String(h).padStart(2,'0')+':00'}}

    const choice=catalogData.choice||{},shops=unpack(catalogData.shops),blueprints=unpack(catalogData.blueprints),providers=unpack(catalogData.providers),variants=unpack(catalogData.variants),selected=new Set(listValues(choice.variants).map(String));

    return `<div class="field-grid">${selectField('printify_shop_id','Printify mağazan',shops.map(o=>({id:o.id,label:o.title||o.name||o.sales_channel||'Mağaza'})),choice.shop,'Mağaza seç')}${selectField('printify_blueprint_id','Giyim ürünü',blueprints.map(o=>({id:o.id,label:o.title||o.name})),choice.blueprint,'Ürün seç','data-catalog="blueprint"')}${selectField('printify_provider_id','Baskı sağlayıcısı',providers.map(o=>({id:o.id,label:o.title||o.name})),choice.provider,choice.blueprint?'Sağlayıcı seç':'Önce ürün seç','data-catalog="provider"')}${blueprint?`<div class="catalog-preview">${preview&&/^https:\/\//.test(preview)?`<img src="${esc(preview)}" alt="${esc(blueprint.title)}">`:''}<p>${esc(blueprint.title||'')}<br><span class="muted">${esc(blueprint.brand||'')}</span></p></div>`:''}</div>${variants.length?`<div class="section-head" style="margin:23px 0 4px"><h3 style="margin:0;font-size:13px">Renk ve bedenler</h3><button type="button" class="native-help" data-command="variants-all">Tümünü seç</button></div><small class="muted">Satmak istediğin varyantları seç. Son ürün bilgileri onayından önce gösterilir.</small><div class="variant-list">${variants.map(v=>`<label class="variant-option ${selected.has(String(v.id))?'selected':''}"><input type="checkbox" data-list="printify_variant_ids" value="${esc(v.id)}" ${selected.has(String(v.id))?'checked':''}><span>${esc(v.title||[v.options?.color,v.options?.size].filter(Boolean).join(' · ')||'Varyant')}</span></label>`).join('')}</div><input type="hidden" name="printify_variant_ids" value="${esc([...selected].join(','))}"><small id="variant-count" class="muted" style="display:block;margin-top:10px">${selected.size} varyant seçili</small>`:'<input type="hidden" name="printify_variant_ids" value=""><div class="empty-inline">Varyantlar için ürün ve sağlayıcı seç.</div>'}<button type="button" class="btn btn-quiet btn-sm" data-command="catalog" style="margin-top:17px">↻ Kataloğu yenile</button>`;
  }
  function taxonomyOptions(value,prefix=''){return unpack(value).flatMap(t=>{const label=(prefix?prefix+' / ':'')+(t.name||t.title||'Kategori');return[{id:t.id||t.taxonomy_id,label},...taxonomyOptions(t.children,label)]})}
  function renderEtsyOptions(){
    if(!etsyOptions)return `<div class="notice info">Etsy hesabını yetkilendirdikten sonra kargo, iade ve üretim profillerini kendi mağazandan seçebilirsin.</div><button type="button" class="btn" data-command="etsy-options" style="margin-top:17px">Mağaza seçeneklerini getir →</button>`;
    const shipping=unpack(etsyOptions.shipping_profiles).map(o=>({id:o.shipping_profile_id||o.id,label:o.title||o.name||'Kargo profili'})),ready=unpack(etsyOptions.readiness_states).map(o=>({id:o.readiness_state_id||o.id,label:o.readiness_state||o.title||o.name||[o.min_processing_time,o.max_processing_time,o.processing_time_unit].filter(Boolean).join(' ')})),returns=unpack(etsyOptions.return_policies).map(o=>({id:o.return_policy_id||o.id,label:o.title||o.name||(o.accepts_returns?'İade kabul edilir':'İade kabul edilmez')+(o.return_deadline?' · '+o.return_deadline+' gün':'')})),partners=unpack(etsyOptions.production_partners),taxonomy=taxonomyOptions(etsyOptions.taxonomy||etsyOptions.taxonomies||[]),selected=new Set(listValues(setting('production_partner_ids')).map(String));
    return `<div class="field-grid">${selectField('etsy_shipping_profile_id','Kargo profili',shipping,setting('etsy_shipping_profile_id'))}${selectField('etsy_readiness_state_id','Üretim hazırlık profili',ready,setting('etsy_readiness_state_id'))}${selectField('etsy_return_policy_id','İade politikası',returns,setting('etsy_return_policy_id'))}${taxonomy.length?selectField('etsy_taxonomy_id','Etsy ürün kategorisi',taxonomy,setting('etsy_taxonomy_id')):field('etsy_taxonomy_id',{},'prefs-')}</div>${partners.length?`<h3 style="font-size:13px;margin-top:22px">Üretim ortağın</h3><div class="variant-list">${partners.map(o=>`<label class="variant-option"><input type="checkbox" data-list="production_partner_ids" value="${esc(o.production_partner_id||o.partner_id||o.id)}" ${selected.has(String(o.production_partner_id||o.partner_id||o.id))?'checked':''}><span>${esc(o.production_partner_name||o.name||o.title||'Üretim ortağı')}</span></label>`).join('')}</div><input type="hidden" name="production_partner_ids" value="${esc([...selected].join(','))}">`:'<div class="empty-inline">Mağazada üretim ortağı bulunamadı. Etsy mağaza ayarlarında Printify/baskı sağlayıcını üretim ortağı olarak eklemelisin.</div>'}${etsyOptions.errors?`<div class="notice" style="margin-top:18px">${esc(Object.entries(etsyOptions.errors).map(([k,v])=>k+': '+v).join('\n'))}</div>`:''}<button type="button" class="btn btn-quiet btn-sm" data-command="etsy-options" style="margin-top:17px">↻ Seçenekleri yenile</button>`;
  }
  function renderPreferences(){return `<div class="page-head"><div><div class="eyebrow">Asistanını kendine göre ayarla</div><h1>Senin mağazan, senin tarzın.</h1><p>Bu tercihler yeni araştırmalar ve ürün taslakları için kullanılır.</p></div></div><form id="preferences-form"><section class="panel setting-panel"><h2>Tasarım & pazar</h2><p>Kimi hedeflediğini ve hangi fikirlerin etrafında üretmek istediğini belirt.</p><div class="field-grid">${field('niche',{},'prefs-',{full:true})}${field('target_country',{},'prefs-')}${field('language',{},'prefs-')}${field('currency',{},'prefs-')}${field('retail_price',{},'prefs-')}</div></section><section class="panel setting-panel"><h2>Program & bütçe</h2><p>Programı açtığında pazartesi, çarşamba ve cuma araştırmaları belirlediğin saatte başlar. Sonraki işlemler gerekli onaylarla ilerler.</p><div class="field-grid">${field('time_zone',{},'prefs-')}${field('hour',{},'prefs-')}${field('budget_per_run',{},'prefs-')}</div><label class="toggle-row"><input type="checkbox" name="scheduling_enabled" ${scheduled()?'checked':''}><span><strong>Otomatik araştırma programı açık</strong><small>Kapalıyken yalnızca sen başlattığında çalışır. Programın çalışması için sunucunun açık kalması gerekir.</small></span></label><label class="toggle-row"><input type="checkbox" name="dry_run" ${state.settings?.dry_run!==false?'checked':''}><span><strong>Programı deneme modunda çalıştır</strong><small>Açıkken yalnız bağlantı denemesi yapılır; ücretli üretim veya dış platformlarda ürün/yayın oluşturulmaz.</small></span></label></section><section class="panel setting-panel"><h2>Printify ürünün</h2><p>Kıyafeti ve baskı sağlayıcısını canlı katalogdan seç. JARVIS ilk ürün taslağını bu uygun seçeneklerle hazırlayacak.</p><div id="catalog-content">${renderPrintifyCatalog()}</div></section><section class="panel setting-panel"><h2>Etsy mağaza ayarların</h2><p>Ürününün kargo ve üretim bilgileri mağazanın mevcut profilleriyle eşleşir.</p><div id="etsy-options-content">${renderEtsyOptions()}</div></section><div class="save-bar"><button class="btn btn-primary" type="submit">Tercihleri kaydet →</button></div></form>`}
  function renderEvents(events){return events.length?events.map(e=>`<div class="event-row"><div class="event-time">${esc(formattedTime(e.timestamp||e.created_at||e.time))}</div><div class="event-message ${esc(['error','warning'].includes(e.level)?e.level:'')}">${esc(e.message||e.description||e.event||e.type||'İşlem kaydı')}${e.details?`<div class="muted" style="margin-top:5px">${esc(typeof e.details==='string'?e.details:JSON.stringify(e.details))}</div>`:''}</div></div>`).join(''):'<div class="empty"><div class="empty-symbol">◷</div><h3>Henüz bir işlem yok.</h3><p>Bağlantı kontrolleri, araştırmalar ve onayların burada görünecek.</p></div>'}
  function renderActivity(){const events=state.events||[];return `<div class="page-head"><div><div class="eyebrow">Neler olduğunu bil</div><h1>Asistanının günlüğü.</h1><p>Araştırma, onay ve yayın adımlarının durumunu buradan takip et.</p></div><button class="btn" data-command="refresh">↻ Yenile</button></div><section class="panel"><div class="section-head"><h2>Son işlemler</h2><small>${events.length} kayıt · ${esc(setting('time_zone'))}</small></div><div class="event-list">${renderEvents(events)}</div></section>`}
  function showDialog({title,message,confirm='Onayla',danger=false,onConfirm}){const root=$('#dialog-root');root.innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="eyebrow">Kontrol sende</div><h2 id="dialog-title">${esc(title)}</h2><p>${esc(message)}</p><div class="button-row"><button class="btn btn-quiet" id="dialog-cancel">Vazgeç</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="dialog-confirm">${esc(confirm)}</button></div></section></div>`;const close=()=>root.replaceChildren();$('#dialog-cancel').onclick=close;$('#dialog-confirm').onclick=e=>busy(e.currentTarget,async()=>{await onConfirm();close()});$('.dialog-backdrop').onclick=e=>{if(e.target.classList.contains('dialog-backdrop'))close()};$('#dialog-cancel').focus()}
  async function saveForm(form){const settings=formValues(form);await api('/api/settings',{method:'PATCH',body:{settings}});await loadState();toast('Ayarların güvenli biçimde kaydedildi.');return settings}
  function bindPage(){for(const id of ['connections-form','preferences-form']){const form=$('#'+id);form?.addEventListener('submit',e=>{e.preventDefault();busy($('button[type=submit]',form),()=>saveForm(form))})}$$('[data-action-token]').forEach(b=>b.onclick=()=>{const approve=b.dataset.decision==='approve';showDialog({title:approve?'Bu adımı onaylıyor musun?':'Bu adımı reddet?',message:approve?approvalExplanation(b.dataset.actionKind,b.dataset.actionLabel):'Bu adım ilerlemeyecek. Önceden verilen diğer onaylar bu işlem için kullanılmaz.',confirm:approve?'Onayla ve ilerle':'Reddet',danger:!approve,onConfirm:async()=>{await api('/api/actions/'+encodeURIComponent(b.dataset.actionToken),{method:'POST',body:{decision:b.dataset.decision}});await loadState();toast(approve?'Onayın alındı. Bir sonraki adım hazırlanıyor.':'Bu adım reddedildi.')}})});$$('[data-oauth]').forEach(b=>b.onclick=()=>busy(b,async()=>{const form=$('#connections-form');if(form){await api('/api/settings',{method:'PATCH',body:{settings:formValues(form)}})}window.location.assign(b.dataset.oauth)}))}
  function approvalExplanation(kind,label){const descriptions={generate:'Onayladığında beş özgün tasarım için ücretli AI görsel üretimi başlayacak. Bu aşama ürün veya paylaşım yayınlamaz.',choose_design:'Onayladığında bu tasarım için ürün, renk/beden, fiyat ve satış metni önerisi hazırlanacak. Printify ürün oluşturma aşaması ayrıca onayını bekler.',printify_create:'Onayladığında baskı görseli Printify’a yüklenecek ve gösterilen ürünle yayınlanmamış ürün oluşturulacak. Ürün ve baskı yerleşimini sonraki aşamada inceleyeceksin.',etsy_draft:'Onayladığında gösterilen ürün, başlık, açıklama, etiketler ve varyantlarla Etsy mağazanda bir taslak oluşturulacak. Yayın için ayrı son onayın istenecek.',etsy_publish:'Bu son yayın onayıdır. Gösterilen Etsy taslağı herkese açık olarak satışa çıkacak. Etsy ilan ücretleri uygulanabilir. Başlığı, görseli, fiyatı ve beden/renkleri son kez kontrol et.',social_prepare:'Onayladığında gerçek ürün mockup’ından yeni bir AI manken görseli ve paylaşım metinleri üretilecek. AI kullanım ücretleri oluşabilir. Instagram ve Pinterest yayınları ayrıca onayını bekler.',instagram_publish:'Onayladığında gösterilen manken görseli ve metni bağlı Instagram hesabında herkese açık paylaşılacak.',pinterest_publish:'Onayladığında gösterilen görsel, başlık, açıklama ve ürün bağlantısı seçtiğin Pinterest panosunda paylaşılacak.'};return `“${label}”\n\n${descriptions[kind]||'Onayın görüntülediğin içerikle sınırlıdır. Sonraki aşamalar kendi onaylarını bekler.'}`}
  function renderBoardSelector(){if(!pinterestBoards)return `<div class="button-row"><button type="button" class="btn btn-quiet btn-sm" data-command="boards">Pinterest panolarımı getir →</button></div>`;return `<div style="margin-top:17px">${selectField('pinterest_board_id','Paylaşım panon',unpack(pinterestBoards).map(o=>({id:o.id,label:o.name||o.title||'Pano'})),setting('pinterest_board_id'),'Pano seç')}</div>`}
  async function loadBoards(){const form=$('#connections-form');if(form)await api('/api/settings',{method:'PATCH',body:{settings:formValues(form)}});pinterestBoards=await api('/api/pinterest/boards');const boards=unpack(pinterestBoards);if(boards.length===1){await api('/api/settings',{method:'PATCH',body:{settings:{pinterest_board_id:boards[0].id}}});await loadState();toast('Tek Pinterest panon otomatik seçildi.')}else{renderPage();toast(boards.length?'Paylaşımlar için bir Pinterest panosu seçip bağlantıları kaydet.':'Pinterest hesabında pano bulunamadı. Hesabında bir pano oluştur.')}}
  function catalogChoice(){const form=$('#preferences-form');const input=name=>form?.elements.namedItem(name)?.value;const previous=catalogData?.choice||{};return{shop:input('printify_shop_id')??previous.shop??setting('printify_shop_id'),blueprint:input('printify_blueprint_id')??previous.blueprint??setting('printify_blueprint_id'),provider:input('printify_provider_id')??previous.provider??setting('printify_provider_id'),variants:input('printify_variant_ids')?.split(',').filter(Boolean)??previous.variants??setting('printify_variant_ids')??[]}}
  function refreshCatalogMarkup(){const target=$('#catalog-content');if(target)target.innerHTML=renderPrintifyCatalog()}
  async function loadCatalog(){const choice=catalogChoice();catalogData={...(await api('/api/products/catalog')),choice};if(choice.blueprint){Object.assign(catalogData,await api('/api/products/catalog?blueprint_id='+encodeURIComponent(choice.blueprint)));if(choice.provider)Object.assign(catalogData,await api('/api/products/catalog?blueprint_id='+encodeURIComponent(choice.blueprint)+'&provider_id='+encodeURIComponent(choice.provider)))}refreshCatalogMarkup()}
  async function catalogSelection(select){catalogData.choice=catalogChoice();if(select.dataset.catalog==='blueprint'){catalogData.choice.provider='';catalogData.choice.variants=[];catalogData.providers=[];catalogData.variants=[]}else{catalogData.choice.variants=[];catalogData.variants=[]}const {blueprint,provider}=catalogData.choice;select.disabled=true;try{if(blueprint)Object.assign(catalogData,await api('/api/products/catalog?blueprint_id='+encodeURIComponent(blueprint)+(provider?'&provider_id='+encodeURIComponent(provider):'')))}catch(e){toast(e.message,true)}finally{refreshCatalogMarkup()}}
  function updateList(name){const form=$('#preferences-form');if(!form)return;const choices=$$(`input[data-list="${name}"]`,form),selected=choices.filter(c=>c.checked).map(c=>c.value),hidden=form.elements.namedItem(name);if(hidden)hidden.value=selected.join(',');choices.forEach(c=>c.closest('label').classList.toggle('selected',c.checked));if(name==='printify_variant_ids'){if(catalogData)catalogData.choice.variants=selected;if($('#variant-count'))$('#variant-count').textContent=selected.length+' varyant seçili'}}
  function showTelegramPairing(data){const root=$('#dialog-root'),link=/^https:\/\/t\.me\//.test(data.deep_link||'')?data.deep_link:'';root.innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pair-title"><div class="eyebrow">Güvenli eşleştirme</div><h2 id="pair-title">Telegram’ı sana bağlayalım.</h2><p>${esc(data.message||'Aşağıdaki bağlantıyı açıp Telegram’da Başlat’a dokun. Bu bağlantı yalnız senin sohbetini JARVIS ile eşleştirir.')}</p>${link?`<a class="btn btn-primary" style="width:100%" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Telegram’da aç →</a>`:''}${data.code?`<p style="font-size:11px;margin:18px 0 0">İstersen botuna şu mesajı gönderebilirsin:</p><div class="claim-code">/start ${esc(data.code)}</div>`:''}<p style="font-size:12px">Eşleştirme 10 dakika geçerlidir. Botuna yalnızca genel /start mesajı göndermek hesabı eşleştirmez.</p><div class="button-row"><button class="btn btn-quiet" id="pair-close">Kapat</button><button class="btn" id="pair-check">Eşleşmeyi kontrol et</button></div></section></div>`;$('#pair-close').onclick=()=>root.replaceChildren();$('#pair-check').onclick=e=>busy(e.currentTarget,async()=>{await loadState(false);if(setting('telegram_chat_id')){root.replaceChildren();renderPage();toast('Telegram sohbetin güvenle eşleştirildi.')}else toast('Henüz eşleşme alınmadı. Bağlantıyı açıp Başlat’a dokun, ardından tekrar kontrol et.')});$('#pair-close').focus()}
  async function command(name,button){if(name==='boards'){await loadBoards();return}if(name==='catalog'){await loadCatalog();return}if(name==='etsy-options'){etsyOptions=await api('/api/etsy/options');$('#etsy-options-content').innerHTML=renderEtsyOptions();return}if(name==='variants-all'){$$('input[data-list=printify_variant_ids]').forEach(el=>el.checked=true);updateList('printify_variant_ids');return}if(name==='logout'){await api('/api/logout',{method:'POST',body:{}});await loadState();return}if(name==='refresh'){await loadState();toast('Durum güncellendi.');return}if(name==='check'){const form=$('#connections-form');if(form)await api('/api/settings',{method:'PATCH',body:{settings:formValues(form)}});const data=await api('/api/connections/check');await loadState();toast(data.message||'Bağlantı kontrolü tamamlandı. Ayrıntıları bağlantı kartlarında görebilirsin.');return}if(name==='discover'){const form=$('#connections-form');if(form){await api('/api/settings',{method:'PATCH',body:{settings:formValues(form)}})}const data=await api('/api/telegram/discover',{method:'POST',body:{}});await loadState();showTelegramPairing(data);return}if(name==='voice'){const data=await api('/api/voice-test',{method:'POST',body:{}});const url=assetURL(data.audio_url||data.asset_id||data.url||data.asset);if(url){voiceAudio?.pause();voiceAudio=new Audio(url);await voiceAudio.play();toast('JARVIS’in AI sesi oynatılıyor.')}else toast(data.message||'Ses örneği Telegram’a gönderildi.');return}if(name==='pause'){showDialog({title:'Asistanı duraklat?',message:'Otomatik araştırma duracak ve bekleyen onay bağlantıları iptal edilecek. Devam eden ağ işlemleri anında geri alınamaz. Uzak ürünler silinmez.',confirm:'Duraklat',onConfirm:async()=>{await api('/api/pause',{method:'POST',body:{paused:true}});await loadState();toast('Asistan duraklatıldı. Bekleyen onaylar iptal edildi.')}});return}if(name==='resume'){await api('/api/pause',{method:'POST',body:{paused:false}});await loadState();toast('Asistan duraklatmadan çıkarıldı. Program ayarlarını tercihlerden kontrol edebilirsin.');return}if(name==='dry-run'){const data=await api('/api/run',{method:'POST',body:{dry_run:true}});await loadState();toast(data.message||'Bağlantı denemesi tamamlandı. Üretim veya yayın yapılmadı.');return}if(name==='run'){if(state.settings?.dry_run!==false){showDialog({title:'Gerçek üretime geçmeden önce',message:'Şu anda deneme modu açık. Gerçek araştırma ve tasarım üretimi için Tercihler’de “Programı deneme modunda çalıştır” seçeneğini kapatıp kaydet. API kullanım ücretleri oluşabilir.',confirm:'Tercihleri aç',onConfirm:async()=>{page='preferences';renderPage();window.scrollTo({top:0,behavior:'smooth'})}});return}showDialog({title:'Yeni bir araştırma başlasın mı?',message:`JARVIS güncel trendleri araştıracak. Bu adım AI API kullanımına neden olabilir; paket için hedeflenen AI bütçesi $${setting('budget_per_run')}. Bu hedef garanti edilen harcama sınırı değildir; gerçek ücret sağlayıcıya göre değişir. Tasarım üretimi, ürün hazırlama ve yayın aşamalarında ayrıca onayın istenecek.`,confirm:'Araştırmayı başlat',onConfirm:async()=>{await api('/api/run',{method:'POST',body:{dry_run:false}});await loadState();toast('Araştırma başladı. Gelişmeleri burada ve Telegram’da görebilirsin.')}})}}
  document.addEventListener('click',event=>{const dismiss=event.target.closest('[data-dismiss]');if(dismiss){showDialog({title:'Bu paketi kapat?',message:'Bekleyen onaylar iptal edilir ve yeni araştırmaya yer açılır. Printify, Etsy, Instagram veya Pinterest’te oluşturulmuş ürünler ve paylaşımlar silinmez. Uzak durum belirsizse ilgili platformu da kontrol et.',confirm:'Paketi kapat',onConfirm:async()=>{await api('/api/campaigns/'+encodeURIComponent(dismiss.dataset.dismiss)+'/dismiss',{method:'POST',body:{}});await loadState();toast('Paket kapatıldı. Uzak ürünler silinmedi.')}});return}const nav=event.target.closest('[data-page],[data-go]');if(nav){page=nav.dataset.page||nav.dataset.go;renderPage();window.scrollTo({top:0,behavior:'smooth'});return}const button=event.target.closest('[data-command]');if(button)busy(button,()=>command(button.dataset.command,button))});
  document.addEventListener('change',e=>{if(e.target.matches('[data-catalog]'))catalogSelection(e.target);if(e.target.matches('input[data-list]'))updateList(e.target.dataset.list)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#dialog-root').replaceChildren()});
  async function backgroundRefresh(){if(document.hidden||!state.authenticated||refreshing)return;const editing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)||$('#dialog-root').hasChildNodes();try{await loadState(!editing&&['overview','activity'].includes(page));if(!editing)updateChrome()}catch{} }
  setInterval(backgroundRefresh,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)backgroundRefresh()});
  loadState().catch(e=>{$('#boot-error').innerHTML=`<p class="error">${esc(e.message||'Sunucuya erişilemedi.')}</p><button class="btn btn-sm" id="boot-retry">Yeniden dene</button>`;$('#boot-retry').onclick=()=>window.location.reload()});
  </script>
