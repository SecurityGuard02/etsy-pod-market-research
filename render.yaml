services:
  - type: web
    name: jarvis-etsy-assistant
    runtime: docker
    repo: https://github.com/SecurityGuard02/etsy-pod-market-research
    branch: jarvis-ready
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeploy: false
    healthCheckPath: /healthz
    disk:
      name: jarvis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: JARVIS_DATA_DIR
        value: /data
      - key: APP_PASSWORD
        generateValue: true
      - key: JARVIS_SETUP_TOKEN
        generateValue: true
